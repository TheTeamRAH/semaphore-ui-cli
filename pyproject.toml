[project]
name = "semaphore-ui"
version = "0.3.0"
description = "CLI for running and inspecting Semaphore UI tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
semaphore-ui = "semaphore_ui.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semaphore_ui"]

[tool.pytest.ini_options]
pythonpath = ["src"]
